<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nicaragua · Mi mapa de viajes</title>
  <meta name="description" content="Mapa interactivo de Nicaragua para marcar los lugares que visité y los que quiero visitar.">
  <meta name="theme-color" content="#0b6e7f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mapa NI">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <button id="btn-menu" class="icon-btn menu-btn" type="button" aria-label="Mostrar lista de lugares" aria-expanded="false" aria-controls="sidebar">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <div class="brand">
      <h1>Nicaragua</h1>
      <p>Lo que ya pisé y lo que falta</p>
    </div>

    <div class="stats" id="stats" aria-live="polite">
      <div class="stat" style="--c: var(--c-visitado)"><b id="st-visitados">0</b><span>visitados</span></div>
      <div class="stat" style="--c: var(--c-quiero)"><b id="st-porvisitar">0</b><span>por visitar</span></div>
      <div class="stat" style="--c: var(--c-planeado)"><b id="st-confecha">0</b><span>con fecha</span></div>
      <div class="progress" title="Lugares visitados sobre el total">
        <div class="bar"><i id="st-bar"></i></div>
        <span id="st-pct">0 % explorado</span>
      </div>
    </div>
  </header>

  <div class="layout">

    <!-- Lista lateral: búsqueda, filtros y lugares -->
    <aside class="sidebar" id="sidebar" aria-label="Lista de lugares">
      <div class="side-top">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m13.5 13.5 3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Buscar lugar o departamento" autocomplete="off">
        </label>

        <div id="filtros" class="chips" role="group" aria-label="Filtrar por estado"></div>

        <div class="toggles">
          <label><input type="checkbox" id="chk-deps" checked autocomplete="off"> Departamentos</label>
          <label><input type="checkbox" id="chk-ciudades" checked autocomplete="off"> Ciudades y pueblos</label>
          <label><input type="checkbox" id="chk-propios" autocomplete="off"> Solo pines añadidos por mí</label>
        </div>
      </div>

      <div class="list-head">
        <span id="count-label">0 lugares</span>
        <button id="btn-center" class="link-btn" type="button">Ver toda Nicaragua</button>
      </div>

      <ul id="list" class="list"></ul>

      <div class="side-foot">
        <button id="btn-export" class="btn btn--soft" type="button">Exportar respaldo</button>
        <button id="btn-import" class="btn btn--soft" type="button">Importar</button>
        <input id="file-import" type="file" accept="application/json,.json" hidden>
      </div>
    </aside>

    <main class="map-wrap">
      <div id="banner" class="banner" hidden></div>
      <div id="map" aria-label="Mapa interactivo de Nicaragua"></div>

      <button id="btn-add" class="fab" type="button">＋ Añadir lugar</button>
      <div id="hint" class="hint" hidden>Toca el mapa donde está el lugar nuevo. Esc para cancelar.</div>

      <!-- Panel de edición -->
      <aside id="panel" class="panel" aria-hidden="true" aria-label="Editar lugar">
        <form id="form" autocomplete="off" novalidate>
          <header class="panel-head">
            <div class="panel-title">
              <h2 id="p-titulo">Lugar</h2>
              <p id="p-sub"></p>
            </div>
            <button type="button" class="icon-btn" id="p-close" aria-label="Cerrar panel">
              <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </header>

          <div class="panel-body">
            <div id="nuevo-campos" hidden>
              <label class="field">
                <span>Nombre</span>
                <input type="text" name="nombre" maxlength="80" placeholder="Ej. Laguna de Apoyo">
              </label>
              <div class="row">
                <label class="field">
                  <span>Tipo</span>
                  <select name="tipo">
                    <option value="ciudad">Ciudad o pueblo</option>
                    <option value="lugar">Lugar de interés</option>
                  </select>
                </label>
                <label class="field">
                  <span>Departamento</span>
                  <select name="departamento" id="f-dep"></select>
                </label>
              </div>
              <div class="row">
                <label class="field">
                  <span>Latitud</span>
                  <input type="number" name="lat" step="any" inputmode="decimal">
                </label>
                <label class="field">
                  <span>Longitud</span>
                  <input type="number" name="lng" step="any" inputmode="decimal">
                </label>
              </div>
            </div>

            <fieldset class="field">
              <legend>Estado</legend>
              <div id="estados" class="estados"></div>
            </fieldset>

            <div class="row">
              <label class="field" id="fld-visita">
                <span>Fecha de visita</span>
                <input type="date" name="fechaVisita">
              </label>
              <label class="field" id="fld-prevista">
                <span>Fecha prevista</span>
                <input type="date" name="fechaPrevista">
              </label>
            </div>

            <label class="field">
              <span>Notas</span>
              <textarea name="notas" rows="5" placeholder="Con quién fui, qué comer, qué no me puedo perder…"></textarea>
            </label>
          </div>

          <footer class="panel-foot">
            <button type="button" class="btn btn--quiet" id="btn-borrar">Restablecer</button>
            <button type="submit" class="btn btn--primary">Guardar cambios</button>
          </footer>
        </form>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
  <script>
    // Registro del Service Worker para PWA / offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('SW registrado:', reg.scope))
          .catch((err) => console.warn('SW no se pudo registrar:', err));
      });
    }
  </script>
</body>
</html>
